<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <h1 id="name"></h1>
    <button id="lens" class="switch" type="button" role="switch" aria-checked="false" aria-label="Cuts on this page" aria-describedby="status" hidden></button>
  </header>
  <p id="status" role="status">Reading…</p>
  <button id="connect-action" class="primary" type="button" hidden>Set up</button>
  <a id="manage" class="primary" target="_blank" rel="noreferrer" hidden>Manage usage</a>
  <p id="error" role="status" hidden></p>
  <label id="site-setting" hidden>
    <input id="always" type="checkbox">
    <span id="site-label"></span>
    <span id="site-builtin" class="muted" hidden>built in</span>
  </label>
  <section id="enabled-sites" aria-labelledby="sites-heading" hidden>
    <h2 id="sites-heading">Runs on</h2>
    <ul id="sites"></ul>
  </section>
  <footer>
    <kbd id="shortcut" hidden></kbd>
    <a id="change" href="chrome://extensions/shortcuts">Set a shortcut</a>
    <button id="settings-link" class="quiet" type="button">Settings</button>
  </footer>
</body>
</html>
